# Publishes a release: the multi-architecture image to GHCR, then the GitHub Release that points
# at it. Triggered by a tag (v1.0.0), and re-runnable for an existing tag through "Run workflow"
# - re-running republishes the image and updates the release instead of failing on it.
#
# AGPL-3.0 with a prebuilt image is fine: the source stays in this repository, and the image
# carries the same license. See the release procedure in AGENTS.md.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        default: v1.0.0

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything the tag must satisfy before anything is published; these are the CI checks.
  checks:
    uses: ./.github/workflows/ci.yml

  meta:
    name: Resolve the release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      minor: ${{ steps.meta.outputs.minor }}
      image: ${{ steps.meta.outputs.image }}
      latest: ${{ steps.meta.outputs.latest }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$tag' is not a release tag (expected v<major>.<minor>.<patch>)"
            exit 1
          fi
          # GHCR only accepts lowercase repository paths, and this repository is not lowercase
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stockindicators"
          # v1.1.0-rc1 must not move :latest, and a pre-release is not a release
          if [[ "$version" == *-* ]]; then
            latest=false; prerelease=true
          else
            latest=true; prerelease=false
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "minor=${version%.*}"
            echo "image=$image"
            echo "latest=$latest"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::publishing $image:$version (latest=$latest, prerelease=$prerelease)"

  image:
    name: Image (${{ matrix.arch }})
    needs: [checks, meta]
    # ubuntu-24.04-arm is a standard hosted runner: free on a public repository, and native, so
    # nothing here runs under emulation
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          # a manual run resolves the tag itself: GITHUB_SHA would be the default branch tip
          ref: refs/tags/${{ needs.meta.outputs.tag }}
          fetch-depth: 1

      - name: Resolve the commit
        id: git
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # the per-architecture tags are the inputs of the manifest list below, and a useful
          # escape hatch on their own; the merged $IMAGE:$VERSION is what people pull
          tags: ${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.version }}-${{ matrix.arch }}
          build-args: |
            APP_VERSION=${{ needs.meta.outputs.version }}
            GIT_SHA=${{ steps.git.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=minimal
          push: true
          # attestations of a single architecture would land as extra package versions and the
          # manifest merge below does not carry them
          provenance: false

  manifest:
    name: Publish the manifest list
    needs: [meta, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge the architectures
        id: merge
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          VERSION: ${{ needs.meta.outputs.version }}
          MINOR: ${{ needs.meta.outputs.minor }}
          LATEST: ${{ needs.meta.outputs.latest }}
        run: |
          set -euo pipefail
          # the alias tags follow the release: :1.0 and :latest move to the newest release, a
          # pre-release only gets its own version
          targets=("-t" "$IMAGE:$VERSION")
          if [[ "$LATEST" == true ]]; then
            targets+=("-t" "$IMAGE:$MINOR" "-t" "$IMAGE:latest")
          fi
          docker buildx imagetools create "${targets[@]}" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{ .Manifest.Digest }}')
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  release:
    name: Create the GitHub release
    needs: [meta, manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.meta.outputs.tag }}
          fetch-depth: 1

      - name: Write the notes
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          MINOR: ${{ needs.meta.outputs.minor }}
          IMAGE: ${{ needs.meta.outputs.image }}
          DIGEST: ${{ needs.meta.outputs.digest }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          if [[ -f "docs/releases/$TAG.md" ]]; then
            cat "docs/releases/$TAG.md" > "$notes"
          else
            # a release without its own notes file still says something usable about the image
            {
              echo "$TAG of Stock Indicators."
              echo
              echo "~~~bash"
              echo "git clone https://github.com/$GITHUB_REPOSITORY && cd StockIndicators/packaging"
              echo "cp .env.example .env    # then set SI_PASSWORD"
              echo "SI_IMAGE_TAG=$VERSION docker compose up -d"
              echo "~~~"
            } > "$notes"
          fi
          {
            echo
            echo "## Image"
            echo
            echo "| tag | architecture |"
            echo "|---|---|"
            echo "| \`$IMAGE:$VERSION\` | amd64, arm64 |"
            if [[ "$PRERELEASE" != true ]]; then
              echo "| \`$IMAGE:$MINOR\`, \`$IMAGE:latest\` | the newest release |"
            fi
            echo
            echo "Pinned digest: \`$IMAGE@$DIGEST\`"
            echo
            echo "The published image bakes \`SEO_BASE_URL\` empty, so the static link-preview pages"
            echo "keep relative addresses; publishing behind a domain means building the image once"
            echo "with that build arg (see the README)."
          } >> "$notes"
          cat "$notes"

      - name: Publish the release
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # gh takes asset files as positional arguments, and the default compose file only works
          # together with the source override and .env.example, so all three travel
          assets=(packaging/docker-compose.yml packaging/docker-compose.source.yml packaging/.env.example)
          # re-running a release must not fail on the tag or on assets that are already attached
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" \
              --prerelease="$PRERELEASE"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" \
              --prerelease="$PRERELEASE" "${assets[@]}"
          fi
          gh release view "$TAG" --json tagName,prerelease,url,assets
