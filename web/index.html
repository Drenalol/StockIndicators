<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Stock Indicators</title>
    <meta name="description" content="Monitor indicators on stocks, ETFs and crypto. Telegram, push, Discord and webhook alerts the moment your rule triggers." />
    <!-- Telegram Mini Apps SDK is not loaded here on purpose: outside the Telegram
         client it only spams the console with its internal postEvent logs. The app
         injects it itself, and only on a Telegram launch (tgWebApp* in the hash) —
         see lib/telegram.ts. initData never depended on the script anyway: it is
         parsed from the tgWebAppData URL hash. -->
    <!-- Site-mode stamp placeholder: the API replaces this comment with a script setting
         window.__SI_SITE_LANDING_ONLY__ when it serves the shell (see Internal/SiteModeScript),
         so a public landing knows its shape on the first paint. Served without the stamp
         (vite dev, static hosting) the frontend probes GET /api/site/config instead. -->
    <!--si:site-mode-->
    <script>
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { /* ignore */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Static Logo.dev attribution for crawlers (including Logo.dev's own link verifier,
         which may not run JS and only sees this shell): the user-visible link lives in the
         Instrument logos section of /legal/licenses, so this copy only surfaces when the
         app itself cannot render. -->
    <noscript>
      <p style="font: 12px/1.6 system-ui, sans-serif; text-align: center; padding: 12px">
        <a href="https://logo.dev">Logos provided by Logo.dev</a>
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
